<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TempMon Dashboard</title>

  <style>
    body {
      font-family: Arial;
      background: #0f0f0f;
      color: white;
      text-align: center;
      margin: 0;
      padding: 10px;
      /* 避免滑動時整個網頁跟著左右晃動 */
      overflow-x: hidden; 
    }

    h2 {
      color: #00ffd5;
      margin-bottom: 15px;
    }

    .card {
      background: #1e1e1e;
      margin: 10px auto;
      padding: 15px;
      border-radius: 12px;
      font-size: 20px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 10px rgba(0,255,213,0.2);
    }

    .time {
      color: #ffcc00;
      margin-bottom: 15px;
    }

    .value {
      font-size: 26px;
      font-weight: bold;
      color: #00ff99;
    }

    /* 左右滑動的容器 */
    .swipe-container {
      display: flex;
      width: 100%;
      overflow-x: auto;
      /* CSS 滾動捕捉 (手機滑動的靈魂) */
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 10px;
    }

    /* 隱藏底部的滾動條 */
    .swipe-container::-webkit-scrollbar {
      display: none;
    }

    /* 單個滑動頁面 */
    .swipe-page {
      min-width: 100%;
      scroll-snap-align: center;
      box-sizing: border-box;
    }

    .page-title {
      color: #00ffd5;
      font-size: 18px;
      margin: 5px 0 15px 0;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h2>🔥 即時溫度監控</h2>

<div class="card time">
  更新時間<br>
  <span id="time">-</span>
</div>


<!-- 左右滑動區塊 -->
<div class="swipe-container" id="swipe-container">
  
  <!-- 第 1 頁：儲冰槽 -->
  <div class="swipe-page">
    <div class="card">乳品溫度<br><span class="value" id="b">-</span></div>
    <div class="card">乳品110<br><span class="value" id="c">-</span></div>
    <div class="card">乳飲溫度<br><span class="value" id="a">-</span></div>
    <div class="card">一廠回水<br><span class="value" id="d">-</span></div>
    <div class="card">二廠回水<br><span class="value" id="e">-</span></div>
  </div>

  <!-- 第 2 頁：冷藏庫 -->
  <div class="swipe-page">
    <div class="card">一廠<br><span class="value" id="f1">-</span></div>
    <div class="card">二廠<br><span class="value" id="f2">-</span></div>
    <div class="card">布丁<br><span class="value" id="f3">-</span></div>
    <div class="card">一出<br><span class="value" id="f4">-</span></div>
    <div class="card">二出<br><span class="value" id="f5">-</span></div>
  </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
  // 🔘 監聽滑動事件，更新小點點的狀態
  const container = document.getElementById('swipe-container');
  const dot1 = document.getElementById('dot-1');
  const dot2 = document.getElementById('dot-2');

  container.addEventListener('scroll', () => {
    // 計算目前滑動的位置
    const scrollLeft = container.scrollLeft;
    const clientWidth = container.clientWidth;
    const activeIndex = Math.round(scrollLeft / clientWidth);

    if (activeIndex === 0) {
      dot1.classList.add('active');
      dot2.classList.remove('active');
    } else {
      dot1.classList.remove('active');
      dot2.classList.add('active');
    }
  });


  // 🔥 Firebase config
  const firebaseConfig = {
    databaseURL: "https://temp-mon-dab85-default-rtdb.asia-southeast1.firebasedatabase.app"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const ref = db.ref("plant/latest");

  // ⏱ timestamp 轉時間
  function formatTime(ts) {
    if (!ts) return "-";
  
    const year = ts.slice(0,4);
    const month = ts.slice(4,6);
    const day = ts.slice(6,8);
    const hour = ts.slice(8,10);
    const min = ts.slice(10,12);
    const sec = ts.slice(12,14);
  
    return `${year}/${month}/${day} ${hour}:${min}:${sec}`;
  }

  // 🔄 即時監聽
  ref.on("value", (snapshot) => {
    const data = snapshot.val();
    if (!data) return;

    // 儲冰槽
    document.getElementById("a").innerText = data["乳飲溫度"] ?? "-";
    document.getElementById("b").innerText = data["乳品溫度"] ?? "-";
    document.getElementById("c").innerText = data["乳品110"] ?? "-";
    document.getElementById("d").innerText = data["一處回水"] ?? "-";
    document.getElementById("e").innerText = data["二處回水"] ?? "-";

    // 冷藏庫 (⚠️請修改引號內的名稱，對應你 Firebase 的實際欄位)
    document.getElementById("f1").innerText = data["一廠"] ?? "-";
    document.getElementById("f2").innerText = data["二廠"] ?? "-";
    document.getElementById("f3").innerText = data["布丁"] ?? "-";
    document.getElementById("f4").innerText = data["一出"] ?? "-";
    document.getElementById("f5").innerText = data["二出"] ?? "-";

    // 更新時間
    document.getElementById("time").innerText = formatTime(data["ts"]);
  });
</script>

</body>
</html>
